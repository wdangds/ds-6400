<script>
(() => {
  "use strict";

  const boxSelector = ".theorem, .example, .callout";
  const displayMathSelector = 'mjx-container[display="true"]';
  let fitFrame = 0;
  let fittingStarted = false;

  function fitDisplayMath(displayMath) {
    // Measure at the normal MathJax size every time so equations can grow
    // back after their container becomes wider.
    displayMath.style.removeProperty("font-size");
    displayMath.removeAttribute("data-math-fit-scale");

    const wrapper = displayMath.closest(".math.display") || displayMath.parentElement;
    // Quarto may configure MathJax's SVG or CHTML renderer. Both express
    // their natural width relative to the container's font size.
    const renderedMath = displayMath.querySelector("mjx-math, svg");

    if (!wrapper || !renderedMath) {
      return;
    }

    const wrapperStyle = window.getComputedStyle(wrapper);
    const horizontalPadding =
      Number.parseFloat(wrapperStyle.paddingLeft) +
      Number.parseFloat(wrapperStyle.paddingRight);
    const availableWidth = wrapper.clientWidth - horizontalPadding;
    const naturalWidth = renderedMath.getBoundingClientRect().width;

    if (availableWidth <= 0 || naturalWidth <= availableWidth) {
      return;
    }

    // Leave a small margin so sub-pixel rounding does not create a scrollbar.
    const scale = (availableWidth / naturalWidth) * 0.98;
    displayMath.style.fontSize = `${scale * 100}%`;
    displayMath.dataset.mathFitScale = scale.toFixed(3);
  }

  function fitAllBoxMath() {
    document.querySelectorAll(boxSelector).forEach((box) => {
      box.querySelectorAll(displayMathSelector).forEach(fitDisplayMath);
    });
  }

  function scheduleFit() {
    window.cancelAnimationFrame(fitFrame);
    fitFrame = window.requestAnimationFrame(() => {
      // Use a second frame so layout reflects the reset to normal size.
      window.requestAnimationFrame(fitAllBoxMath);
    });
  }

  async function startFitting() {
    if (fittingStarted) {
      return;
    }
    fittingStarted = true;

    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    scheduleFit();

    if ("ResizeObserver" in window) {
      const resizeObserver = new ResizeObserver(scheduleFit);
      document.querySelectorAll(boxSelector).forEach((box) => resizeObserver.observe(box));
    } else {
      window.addEventListener("resize", scheduleFit, {passive: true});
    }

    // Also handle equations inserted later by notebook or Quarto components.
    const mutationObserver = new MutationObserver((mutations) => {
      if (
        mutations.some((mutation) =>
          [...mutation.addedNodes].some(
            (node) =>
              node.nodeType === Node.ELEMENT_NODE &&
              (node.matches?.(displayMathSelector) || node.querySelector?.(displayMathSelector))
          )
        )
      ) {
        scheduleFit();
      }
    });

    mutationObserver.observe(document.body, {childList: true, subtree: true});
  }

  const mathJaxReady = window.MathJax?.startup?.promise;

  if (mathJaxReady && typeof mathJaxReady.then === "function") {
    // Plotly outputs can load their own MathJax renderer and cause the shared
    // startup promise to reject even though the page equations were rendered.
    // Fit in either case.
    mathJaxReady.then(startFitting, startFitting);
  }

  // Always keep the ordinary page-load event as a fallback. Some embedded
  // widgets replace window.MathJax and leave an earlier startup promise pending.
  if (document.readyState === "complete") {
    startFitting();
  } else {
    window.addEventListener("load", startFitting, {once: true});
  }
})();
</script>
