project:
  type: book
  resources:
    - .nojekyll

jupyter: ds-6400

execute:
  freeze: auto
  warning: false

book:
  title: "DS 6400 Weekly Writing"
  author: "Wan Dang"
  date: "2026-08-27"
  cover-image: cover.png
  chapters:
    - index.qmd
    - part: "Weekly Writing"
      chapters:
        - weeks/01.qmd
        - weeks/02.qmd
    - references.qmd

bibliography: references.bib

filters:
  - filters/draft.lua

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    include-in-header:
      - tex/mathjax.html
